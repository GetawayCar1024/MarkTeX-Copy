<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkTeX Copy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="hero">
      <img src="../icons/icon128.png" alt="" class="app-icon">
      <div>
        <h1>MarkTeX Copy</h1>
        <p data-i18n="popup.subtitle"></p>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section class="group pdf-group" id="pdfGroup" hidden>
      <button class="row action" id="openPdf">
        <span class="tile tile-red">
          <svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5zM7.5 13v5h1.3v-1.6h.8a1.7 1.7 0 0 0 0-3.4zm1.3 1.1h.8a.6.6 0 0 1 0 1.2h-.8zm3-1.1v5h1.6a2.5 2.5 0 0 0 0-5zm1.3 1.1h.3a1.4 1.4 0 0 1 0 2.8h-.3zm3.4-1.1v5h1.3v-2h1.8v-1.1h-1.8v-.8h2V13z"/></svg>
        </span>
        <span class="label" data-i18n="popup.openPdf"></span>
        <span class="chevron"></span>
      </button>
    </section>

    <h2 class="group-title" data-i18n="popup.groupCopy"></h2>
    <section class="group">
      <button class="row action" data-format="markdown">
        <span class="tile tile-blue">
          <svg viewBox="0 0 24 24"><path d="M3 17V7h2.4l2.6 3.4L10.6 7H13v10h-2.4v-6.2L8 14l-2.6-3.2V17zm13.5 0-3.5-4h2.3V7h2.4v6H20z"/></svg>
        </span>
        <span class="label">Markdown</span>
        <span class="detail" data-shortcut-label="markdown"></span>
        <span class="chevron"></span>
      </button>
      <button class="row action" data-format="html">
        <span class="tile tile-orange">
          <svg viewBox="0 0 24 24"><path d="M8.6 16.6 4 12l4.6-4.6L10 8.8 6.8 12l3.2 3.2zm6.8 0L14 15.2l3.2-3.2L14 8.8l1.4-1.4L20 12z"/></svg>
        </span>
        <span class="label" data-i18n="popup.rowHtml"></span>
        <span class="detail" data-shortcut-label="html"></span>
        <span class="chevron"></span>
      </button>
      <button class="row action" data-format="html-source">
        <span class="tile tile-gray">
          <svg viewBox="0 0 24 24"><path d="M9 4H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h2v-2H7v-4.5A2.5 2.5 0 0 0 5.6 12 2.5 2.5 0 0 0 7 9.5V6h2zm6 0h2a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-2v-2h2v-4.5a2.5 2.5 0 0 1 1.4-2.5A2.5 2.5 0 0 1 17 9.5V6h-2z"/></svg>
        </span>
        <span class="label" data-i18n="popup.rowHtmlSource"></span>
        <span class="detail" data-shortcut-label="html-source"></span>
        <span class="chevron"></span>
      </button>
    </section>

    <section class="group preview-group" id="previewGroup" hidden>
      <div class="row static">
        <span class="label" data-i18n="popup.preview"></span>
        <span class="detail" id="previewMeta"></span>
      </div>
      <textarea id="preview" readonly spellcheck="false"></textarea>
    </section>

    <h2 class="group-title" data-i18n="popup.groupMath"></h2>
    <section class="group">
      <div class="row static">
        <span class="label" data-i18n="popup.inline"></span>
        <div class="seg" data-name="inlineDelim">
          <button data-value="dollar">$ … $</button>
          <button data-value="paren">\( … \)</button>
        </div>
      </div>
      <div class="row static">
        <span class="label" data-i18n="popup.display"></span>
        <div class="seg" data-name="displayDelim">
          <button data-value="dollar">$$ … $$</button>
          <button data-value="bracket">\[ … \]</button>
        </div>
      </div>
      <div class="row static">
        <span class="label" data-i18n="popup.htmlMath"></span>
        <div class="seg" data-name="htmlMath">
          <button data-value="latex">LaTeX</button>
          <button data-value="mathml">MathML</button>
        </div>
      </div>
    </section>
    <p class="footnote" data-i18n="popup.footMath"></p>

    <h2 class="group-title" data-i18n="popup.groupKeys"></h2>
    <section class="group">
      <div class="row static">
        <span class="label">Markdown</span>
        <span class="keys"><button class="key" data-format="markdown"></button><button class="clear" data-clear="markdown"></button></span>
      </div>
      <div class="row static">
        <span class="label" data-i18n="popup.rowHtml"></span>
        <span class="keys"><button class="key" data-format="html"></button><button class="clear" data-clear="html"></button></span>
      </div>
      <div class="row static">
        <span class="label" data-i18n="popup.rowHtmlSource"></span>
        <span class="keys"><button class="key" data-format="html-source"></button><button class="clear" data-clear="html-source"></button></span>
      </div>
    </section>
    <p class="footnote" id="keyHint"></p>

    <h2 class="group-title" data-i18n="popup.groupGeneral"></h2>
    <section class="group">
      <div class="row static">
        <span class="label" data-i18n="popup.language"></span>
        <div class="seg seg-3" data-name="language">
          <button data-value="auto" data-i18n="popup.langAuto"></button>
          <button data-value="zh">中文</button>
          <button data-value="en">English</button>
        </div>
      </div>
      <label class="row static">
        <span class="label" data-i18n="popup.escape"></span>
        <input type="checkbox" class="switch" name="escapeMarkdown">
      </label>
      <label class="row static">
        <span class="label" data-i18n="popup.appendSource"></span>
        <input type="checkbox" class="switch" name="appendSource">
      </label>
      <label class="row static">
        <span class="label" data-i18n="popup.showToast"></span>
        <input type="checkbox" class="switch" name="showToast">
      </label>
      <label class="row static">
        <span class="label" data-i18n="popup.pdfReader"></span>
        <input type="checkbox" class="switch" name="openPdfInViewer">
      </label>
    </section>

    <footer>
      <span id="version"></span> ·
      <a href="https://github.com/GetawayCar1024/marktex-copy" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </main>

  <script src="../src/settings.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
